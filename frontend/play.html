<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Game</title>
    <link rel="stylesheet" href="play.css">
</head>

<body>

    <div class="play-page">

        <div class="game-area" id="gameArea">

            <div class="profile-section">
                <div class="profile-pic-wrapper">
                    <div class="profile-pic" id="profilePic">👨</div>
                    <label for="uploadImage" class="edit-icon">✏️</label>
                    <input type="file" id="uploadImage" accept="image/*" hidden>
                </div>
                <p class="profile-name" id="profileName">User Name</p>
            </div>

            <a href="game.html" class="back-btn">⬅ Back</a>

            <p class="placeholder-text">Game yaha load hoga...</p>

        </div>

    </div>

    <script src="play.js"></script>
</body>

</html>
